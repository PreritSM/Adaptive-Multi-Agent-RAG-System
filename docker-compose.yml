version: "3.11"

services:
  api:
    build:
      context: .
      target: runtime
    container_name: multiagent_rag_api
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - CHROMA_URL=http://chromadb:8000
      - DATABASE_URL=sqlite+aiosqlite:///./perf_logs.db
    volumes:
      - ./perf_logs.db:/app/perf_logs.db
    depends_on:
      qdrant:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rag_net

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: multiagent_rag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag_net

  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: multiagent_rag_chromadb
    ports:
      - "8001:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chroma_storage:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag_net

volumes:
  qdrant_storage:
  chroma_storage:

networks:
  rag_net:
    driver: bridge
